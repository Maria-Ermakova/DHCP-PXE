- name: Setup PXE Server
  hosts: pxeserver
  become: yes
  gather_facts: yes

  vars:
    # Сетевые параметры
    dhcp_range_start: "10.0.0.100"
    dhcp_range_end: "10.0.0.120"
    server_ip_for_web: "10.0.0.20"

    # Версии Ubuntu
    ubuntu_release: "noble"  # 24.04
    ubuntu_version: "24.04"

    # Параметры установки
    username: "otus"
    user_password_hash: "$6$sJgo6Hg5zXBwkkI8$btrEoWAb5FxKhajagWR49XM4EAOfO/Dr5bMrLOkGe3KkMYdsh7T3MU5mYwY2TIMJpVKckAwnZFs2ltUJ1abOZ."
    hostname: "linux"

    # Пути
    ks_dir: "/srv/ks"
    tftp_root: "/srv/tftp/amd64"
    images_dir: "/srv/images"
    iso_filename: "resolute-live-server-amd64.iso"
    netboot_url: "http://cdimage.ubuntu.com/ubuntu-server/daily-live/current/resolute-netboot-amd64.tar.gz"

  tasks:

    # 1) Отключение firewall
    - name: Disable and stop ufw (firewall)
      systemd:
        name: ufw
        state: stopped
        enabled: no

    # 2) Обновление системы
    - name: Update
      apt:
        update_cache: yes


    # 3) Установка необходимых пакетов
    - name: Install required packages
      apt:
        name:
          - dnsmasq
          - apache2
          - wget
          - tar
        state: present
    
    # 4) Создание директории для конфигурации dnsmasq
    - name: Ensure dnsmasq.d directory exists
      file:
        path: /etc/dnsmasq.d
        state: directory
        mode: '0755'

    # 5) Создание конфигурации PXE, но сначала переопределим имя интерфейса
    - name: Get the name of the second network interface
      shell: |
        ip -o link show | awk -F': ' '{print $2}' | grep -v lo | sed -n '2p'
      register: interface_name
      changed_when: false

    - name: Set fact for pxe interface
      set_fact:
        pxe_interface: "{{ interface_name.stdout }}"

    - name: Create dnsmasq PXE configuration
      copy:
        dest: /etc/dnsmasq.d/pxe.conf
        content: |
          # PXE Configuration for Ubuntu {{ ubuntu_version }} netboot
          # Created by Ansible

          # --- Network Interface ---
          interface={{ pxe_interface }}
          bind-interfaces
          # --- DHCP Settings ---
          dhcp-range={{ pxe_interface }},{{ dhcp_range_start }},{{ dhcp_range_end }}

          # --- PXE Boot Settings for Legacy BIOS ---
          dhcp-boot=pxelinux.0

          # --- TFTP Settings ---
          enable-tftp
          tftp-root={{ tftp_root }}
        owner: root
        group: root
        mode: '0644'
      notify: restart dnsmasq

    # 6) Создание директорий для TFTP, образов и автоустановки
    - name: Create TFTP root directory
      file:
        path: "{{ tftp_root }}"
        state: directory
        mode: '0755'
        recurse: yes

    - name: Create images directory
      file:
        path: "{{ images_dir }}"
        state: directory
        mode: '0755'

    - name: Create kickstart directory
      file:
        path: "{{ ks_dir }}"
        state: directory
        mode: '0755'


    # 7) Скачивание и распаковка netboot файлов

    - name: Download and extract netboot files
      unarchive:
        src: "{{ netboot_url }}"
        dest: /srv/tftp
        remote_src: yes
        creates: "{{ tftp_root }}/pxelinux.0"

     # 8) Скачивание ISO образа
    - name: Download Ubuntu Server ISO
      get_url:
        url: "http://cdimage.ubuntu.com/ubuntu-server/daily-live/current/{{ iso_filename }}"
        dest: "{{ images_dir }}/{{ iso_filename }}"
#        checksum: "sha256:ignore"  # Опционально: добавить проверку
      register: iso_download

   # 9) Файлы автоматической установки (cloud-init)
    - name: Create user-data for autoinstall
      copy:
        dest: "{{ ks_dir }}/user-data"
        content: |
          #cloud-config
          autoinstall:
            version: 1
            shutdown: poweroff
            apt:
              disable_components: []
              geoip: true
              preserve_sources_list: false
              primary:
                - arches:
                  - amd64
                  - i386
                  uri: http://us.archive.ubuntu.com/ubuntu
                - arches:
                  - default
                  uri: http://ports.ubuntu.com/ubuntu-ports
            drivers:
              install: false
            identity:
              hostname: {{ hostname }}
              password: {{ user_password_hash }}
              realname: {{ username }}
              username: {{ username }}
            kernel:
              package: linux-generic
            keyboard:
              layout: us
              toggle: null
              variant: ''
            locale: en_US.UTF-8
            network:
              ethernets:
                enp0s3:
                  dhcp4: true
                enp0s8:
                  dhcp4: true
              version: 2
            ssh:
              allow-pw: true
              authorized-keys: []
            install-server: true
            updates: security
        owner: root
        group: root
        mode: '0644'

    - name: Create empty meta-data file
      copy:
        dest: "{{ ks_dir }}/meta-data"
        content: ""
        owner: root
        group: root
        mode: '0644'

    # 10) Создание конфигурации Apache
    - name: Create Apache virtual host configuration
      copy:
        dest: /etc/apache2/sites-available/ks-server.conf
        content: |
          <VirtualHost {{ server_ip_for_web }}:80>
              DocumentRoot /

              <Directory {{ ks_dir }}>
                  Options Indexes MultiViews
                  AllowOverride All
                  Require all granted
              </Directory>

              <Directory {{ images_dir }}>
                  Options Indexes MultiViews
                  AllowOverride All
                  Require all granted
              </Directory>

              ErrorLog ${APACHE_LOG_DIR}/ks-error.log
              CustomLog ${APACHE_LOG_DIR}/ks-access.log combined
          </VirtualHost>
        owner: root
        group: root
        mode: '0644'
      notify: restart apache2

   # 11) Включение сайта и отключение дефолтного
    - name: Enable ks-server site
      command: a2ensite ks-server.conf
      args:
        creates: /etc/apache2/sites-enabled/ks-server.conf
      notify: restart apache2

    - name: Disable default Apache site
      command: a2dissite 000-default.conf
      args:
        removes: /etc/apache2/sites-enabled/000-default.conf
      notify: restart apache2
      ignore_errors: yes

    # 12) Настройка pxelinux.cfg/default
    - name: Create pxelinux.cfg directory
      file:
        path: "{{ tftp_root }}/pxelinux.cfg"
        state: directory
        mode: '0755'

    - name: Configure PXE boot menu
      copy:
        dest: "{{ tftp_root }}/pxelinux.cfg/default"
        content: |
          DEFAULT install
          PROMPT 0                 #загружает вариант по умолчанию без команды
          LABEL install
              KERNEL linux
              INITRD initrd
              APPEND root=/dev/ram0 ramdisk_size=3000000 ip=dhcp iso-url=http://{{ server_ip_for_web }}{{ images_dir }}/{{ iso_filename }} autoinstall ds=nocloud-net;s=http://{{ server_ip_for_web }}{{ ks_dir }}/
        owner: root
        group: root
        mode: '0644'

    # 13) Настройка прав на TFTP директорию для dnsmasq
    - name: Ensure dnsmasq user can read TFTP files
      file:
        path: /srv/tftp
        owner: nobody
        group: nogroup
        recurse: yes
      notify: restart dnsmasq

    # 14) Проверка и запуск сервисов
    - name: Ensure dnsmasq is running and enabled
      systemd:
        name: dnsmasq
        state: started
        enabled: yes

    - name: Ensure apache2 is running and enabled
      systemd:
        name: apache2
        state: started
        enabled: yes

  handlers:
    - name: restart dnsmasq
      systemd:
        name: dnsmasq
        state: restarted

    - name: restart apache2
      systemd:
        name: apache2
        state: restarted

